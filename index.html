<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>ACE Markdown Editor</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/preview.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/print.css">

  <!-- Import Map for ES Modules -->
  <script type="importmap">
  {
    "imports": {
      "codemirror": "https://esm.sh/codemirror@6.0.1",
      "@codemirror/view": "https://esm.sh/@codemirror/view@6.35.0",
      "@codemirror/state": "https://esm.sh/@codemirror/state@6.5.0",
      "@codemirror/lang-markdown": "https://esm.sh/@codemirror/lang-markdown@6.3.1",
      "@codemirror/theme-one-dark": "https://esm.sh/@codemirror/theme-one-dark@6.1.2",
      "marked": "https://esm.sh/marked@15.0.6",
      "marked-highlight": "https://esm.sh/marked-highlight@2.2.1",
      "highlight.js": "https://esm.sh/highlight.js@11.11.1",
      "dompurify": "https://esm.sh/dompurify@3.2.4"
    }
  }
  </script>
</head>
<body>
  <!-- App Shell - Task-03 will add full layout -->
  <div id="app">
    <header class="toolbar">
      <h1>ACE Markdown Editor</h1>
      <div class="toolbar-spacer"></div>
      <button id="theme-toggle" class="btn btn-secondary theme-toggle" aria-label="Toggle theme">
        <span class="theme-icon-light">☀️</span>
        <span class="theme-icon-dark">🌙</span>
      </button>
    </header>

    <main class="main-layout">
      <aside class="sidebar" id="sidebar">
        <!-- Note list - Task-07 -->
      </aside>

      <section class="editor-pane" id="editor-pane">
        <!-- CodeMirror - Task-04 -->
      </section>

      <div class="divider" id="divider"></div>

      <section class="preview-pane" id="preview-pane">
        <!-- Markdown preview - Task-05 -->
      </section>
    </main>
  </div>

  <!-- App Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
