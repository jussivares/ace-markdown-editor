<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>ACE Markdown Editor</title>

  <!-- Fonts: Nunito for UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/preview.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/print.css">
  <!-- Highlight.js theme -->
  <link rel="stylesheet" href="https://esm.sh/highlight.js@11.11.1/styles/github.min.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="https://esm.sh/highlight.js@11.11.1/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="https://esm.sh/highlight.js@11.11.1/styles/github.min.css" class="hljs-theme-light">
  <link rel="stylesheet" href="https://esm.sh/highlight.js@11.11.1/styles/github-dark.min.css" class="hljs-theme-dark" disabled>

  <!-- Import Map for ES Modules -->
  <!-- Pin @codemirror/state and @codemirror/view versions across all packages -->
  <script type="importmap">
  {
    "imports": {
      "@codemirror/state": "https://esm.sh/@codemirror/state@6.5.0",
      "@codemirror/view": "https://esm.sh/@codemirror/view@6.35.0?deps=@codemirror/state@6.5.0",
      "codemirror": "https://esm.sh/codemirror@6.0.1?deps=@codemirror/state@6.5.0,@codemirror/view@6.35.0",
      "@codemirror/commands": "https://esm.sh/@codemirror/commands@6.7.1?deps=@codemirror/state@6.5.0,@codemirror/view@6.35.0",
      "@codemirror/language": "https://esm.sh/@codemirror/language@6.10.6?deps=@codemirror/state@6.5.0,@codemirror/view@6.35.0",
      "@codemirror/lang-markdown": "https://esm.sh/@codemirror/lang-markdown@6.3.1?deps=@codemirror/state@6.5.0,@codemirror/view@6.35.0,@codemirror/language@6.10.6",
      "@codemirror/theme-one-dark": "https://esm.sh/@codemirror/theme-one-dark@6.1.2?deps=@codemirror/state@6.5.0,@codemirror/view@6.35.0",
      "marked": "https://esm.sh/marked@15.0.6",
      "marked-highlight": "https://esm.sh/marked-highlight@2.2.1?deps=marked@15.0.6",
      "highlight.js": "https://esm.sh/highlight.js@11.11.1",
      "dompurify": "https://esm.sh/dompurify@3.2.4"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <button id="sidebar-toggle" class="btn btn-secondary sidebar-toggle" aria-label="Toggle sidebar">
        <span>☰</span>
      </button>
      <h1>ACE Markdown Editor</h1>
      <div class="toolbar-spacer"></div>
      <button id="export-html-btn" class="btn btn-secondary" aria-label="Export HTML" title="Export HTML">
        <span>HTML</span>
      </button>
      <button id="export-pdf-btn" class="btn btn-secondary" aria-label="Export PDF" title="Export PDF">
        <span>PDF</span>
      </button>
      <button id="theme-toggle" class="btn btn-secondary theme-toggle" aria-label="Toggle theme">
        <span class="theme-icon-light">☀️</span>
        <span class="theme-icon-dark">🌙</span>
      </button>
    </header>

    <!-- Sidebar overlay for mobile -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <main class="main-layout" data-mode="edit">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <button id="new-note-btn" class="btn btn-primary new-note-btn">
            <span>+</span> New Note
          </button>
        </div>
        <div class="sidebar-section-header">Recent</div>
        <div class="note-list" id="note-list">
          <!-- Notes rendered dynamically -->
        </div>
      </aside>

      <section class="editor-pane" id="editor-pane">
        <!-- CodeMirror - Task-04 -->
        <div style="padding: var(--spacing-md); color: var(--color-text-secondary);">
          Editor will load here
        </div>
      </section>

      <div class="divider" id="divider"></div>

      <section class="preview-pane" id="preview-pane">
        <!-- Markdown preview - Task-05 -->
        <div style="color: var(--color-text-secondary);">
          Preview will render here
        </div>
      </section>
    </main>

    <!-- Mobile tabs -->
    <nav class="mobile-tabs" id="mobile-tabs">
      <button class="mobile-tab active" data-mode="edit">Edit</button>
      <button class="mobile-tab" data-mode="preview">Preview</button>
    </nav>
  </div>

  <!-- App Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
